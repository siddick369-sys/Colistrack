# Configuration Alembic pour ColisTrack Cameroun V2

[alembic]
# Emplacement relatif des scripts de migration (absolu via %%(here)s)
script_location = %(here)s/alembic

# Ajout du répertoire courant au PYTHONPATH
prepend_sys_path = .
path_separator = os

# Format de nommage des révisions générées
file_template = %%(rev)s_%%(slug)s

# Tronquer les messages longs dans le nom de fichier
truncate_slug_length = 40

# Fuseau horaire UTC
timezone = UTC

# L'URL est surchargée dynamiquement dans alembic/env.py via app.core.config.settings
sqlalchemy.url = postgresql+psycopg2://colistrack_user:colistrack_dev_password@localhost:5433/colistrack_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
