services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: colistrack-backend:c2.4.1
    container_name: colistrack-backend-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - ALLOWED_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://localhost:8001"]
      - SECRET_KEY=dev-insecure-secret-key-change-in-production-min32chars!
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production-min32chars!
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - JWT_ISSUER=colistrack-api
      - JWT_AUDIENCE=colistrack-client
      - DATA_ENCRYPTION_PRIMARY_KEY_ID=k1
      - DATA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - RATE_LIMITING_ENABLED=true
      - DATABASE_URL=postgresql+asyncpg://colistrack_user:colistrack_dev_password@db:5432/colistrack_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://colistrack_user:colistrack_dev_password@db:5432/colistrack_db
    ports:
      # Port hôte 8001 pour l'API (évite le conflit hôte avec le port 8000)
      - "${HOST_PORT:-8001}:8000"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthcheck').getcode() == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16-alpine3.22
    container_name: colistrack-backend-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=colistrack_user
      - POSTGRES_PASSWORD=colistrack_dev_password
      - POSTGRES_DB=colistrack_db
    ports:
      # Port hôte 5433 mappé vers 5432 interne (évite le conflit avec le port 5432 utilisé par KoBuy sur l'hôte)
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - colistrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colistrack_user -d colistrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  colistrack_pgdata:
    name: colistrack_pgdata
